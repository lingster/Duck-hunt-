[tool.poetry]
name = "property-scraper"
version = "0.1.0"
description = "A scraper for Swiss real estate properties."
authors = ["Jules"]

[tool.poetry.dependencies]
python = "^3.9"
typer = {extras = ["rich"], version = "^0.9.0"}
selenium = "^4.12.0"
sqlalchemy = "^2.0.20"
pydantic = "^2.3.0"
webdriver-manager = "^4.0.1"
markdownify = "^0.11.1"

[tool.poetry.dev-dependencies]
pytest = "^7.4.0"

[build-system]
requires = ["poetry-core>=1.0.0"]
build-backend = "poetry.core.masonry.api"
